name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  suites:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: hook suite
        run: bash tests/hooks.sh
      - name: uninstall suite
        run: bash tests/uninstall.sh
